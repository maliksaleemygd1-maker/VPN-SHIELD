# In-Memory Zero-Log Recursive DNS Server for Proton Plus VPN Nodes
server:
    interface: 10.64.0.1
    interface: fd00::1
    interface: 127.0.0.1
    port: 53
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # Access control: accept only from internal VPN clients
    access-control: 127.0.0.0/8 allow
    access-control: 10.64.0.0/10 allow
    access-control: 10.128.0.0/10 allow
    access-control: fd00::/8 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::0/0 refuse

    # Zero Logging Privacy Enforcements
    verbosity: 0
    log-queries: no
    log-replies: no
    log-tag-queryreply: no
    log-local-actions: no
    log-servfail: no
    logfile: "/dev/null"

    # Performance & Caching
    num-threads: 4
    msg-cache-slabs: 8
    rrset-cache-slabs: 8
    infra-cache-slabs: 8
    key-cache-slabs: 8
    rrset-cache-size: 256m
    msg-cache-size: 128m

    # Privacy & Security Enhancements
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    hide-identity: yes
    hide-version: yes
    use-caps-for-id: yes
    prefetch: yes
    prefetch-key: yes

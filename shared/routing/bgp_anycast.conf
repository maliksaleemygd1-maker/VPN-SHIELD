# BIRD BGP Anycast Routing Configuration for Proton Plus VPN Global Gateway
router id 185.120.44.1;

protocol device {
    scan time 10;
}

protocol direct {
    interface "lo", "dummy0";
}

protocol kernel {
    ipv4 {
        export all;
    };
}

# Anycast Virtual IP Announcement (Announces /24 prefix from all edge PoPs)
protocol static {
    ipv4;
    route 185.120.44.0/24 reject;
}

# Upstream Tier 1 Transit Peering (e.g. Lumen, Telia/Arelion, NTT)
protocol bgp upstream_transit_1 {
    local as 64512;
    neighbor 185.120.44.254 as 1299;
    ipv4 {
        import all;
        export filter {
            if net = 185.120.44.0/24 then accept;
            reject;
        };
    };
    graceful restart on;
    bfd on;
}
